<div *ngFor="let bono of bonos" class="bono-card">
  <mat-card class="bono-card__content">
    <h2 class="bono-card__title">Bono #{{ bono.id }}</h2>
    <p class="bono-card__text">Valor Nominal: {{ bono.valorNominal }}</p>
    <p class="bono-card__text">Tasa Cupón: {{ bono.tasaCupon }}%</p>
    <p class="bono-card__text">Plazo: {{ bono.plazoAnios }} años</p>

    <button (click)="toggleEditar(bono)" class="bono-card__edit-button" title="Editar">
      ✏️
    </button>
  </mat-card>

  <div *ngIf="editandoId === bono.id" class="bono-form">
    <label class="bono-form__label">Valor Nominal:</label>
    <input type="number" [(ngModel)]="bono.valorNominal" class="bono-form__input" />

    <label class="bono-form__label">Tasa Cupón (%):</label>
    <input type="number" step="0.01" [(ngModel)]="bono.tasaCupon" class="bono-form__input" />

    <label class="bono-form__label">Tipo de Tasa:</label>
    <input type="text" [(ngModel)]="bono.tipoTasa" class="bono-form__input" />

    <label class="bono-form__label">Capitalización:</label>
    <input type="text" [(ngModel)]="bono.capitalizacion" class="bono-form__input" />

    <label class="bono-form__label">Frecuencia de Pago:</label>
    <input type="text" [(ngModel)]="bono.frecuenciaPago" class="bono-form__input" />

    <label class="bono-form__label">Plazo (años):</label>
    <input type="number" [(ngModel)]="bono.plazoAnios" class="bono-form__input" />

    <label class="bono-form__label">Gracia Total:</label>
    <input type="number" [(ngModel)]="bono.graciaTotal" class="bono-form__input" />

    <label class="bono-form__label">Gracia Parcial:</label>
    <input type="number" [(ngModel)]="bono.graciaParcial" class="bono-form__input" />

    <label class="bono-form__label">Fecha de Emisión:</label>
    <input type="date" [(ngModel)]="bono.fechaEmision" class="bono-form__input" />

    <label class="bono-form__label">Días por Año:</label>
    <input type="number" [(ngModel)]="bono.numeroDiasPorAno" class="bono-form__input" />

    <label class="bono-form__label">Cavali (%):</label>
    <input type="number" step="0.001" [(ngModel)]="bono.cavali" class="bono-form__input" />

    <label class="bono-form__label">Estructuración (%):</label>
    <input type="number" step="0.001" [(ngModel)]="bono.estructuracion" class="bono-form__input" />

    <label class="bono-form__label">Colocación (%):</label>
    <input type="number" step="0.001" [(ngModel)]="bono.colocacion" class="bono-form__input" />

    <label class="bono-form__label">Método de Amortización:</label>
    <input type="text" [(ngModel)]="bono.metodoAmortizacion" class="bono-form__input" />

    <label class="bono-form__label">Moneda:</label>
    <input type="text" [(ngModel)]="bono.moneda" class="bono-form__input" />

    <div class="bono-form__buttons">
      <button (click)="guardarCambios(bono); editandoId = null">💾 Guardar</button>
      <button (click)="verCalculo(bono)">🧮 Calcular</button>
      <button (click)="editandoId = null">Cancelar</button>
    </div>
  </div>
</div>
