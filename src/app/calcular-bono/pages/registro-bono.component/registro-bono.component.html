<form (ngSubmit)="onSubmit()">
  <label for="campo1">Precio de Venta:</label>
  <input type="number" id="campo1" [(ngModel)]="bono.precioDeVenta"><br><br>
  <label for="campo2">Cuota inicial:</label>
  <input type="number" id="campo2" [(ngModel)]="bono.cuotaInicial"><br><br>
  <label for="campo3">Prestamo:</label>
  <input type="number" id="campo3" [(ngModel)]="bono.prestamo"><br><br>
  <label for="campo4">Frecuencia de pago:</label>
  <input type="text" id="campo4" [(ngModel)]="bono.frecuenciaPago"><br><br>
  <label for="campo5">Plazo:</label>
  <input type="number" id="campo5" [(ngModel)]="bono.plazo"><br><br>
  <label for="campo6">TEA:</label>
  <input type="number" id="campo6" [(ngModel)]="bono.tea"><br><br>
  <label for="campo7">Numero de Periodos:</label>
  <input type="number" id="campo7" [(ngModel)]="bono.numeroPeriodos"><br><br>
  <label for="campo8">Plazo de Gracia:</label>
  <input type="number" id="campo8" [(ngModel)]="bono.plazoDeGracia"><br><br>
  <label for="campo9">Fecha de primer pago:</label>
  <input type="text" id="campo9" [(ngModel)]="bono.precioDeVenta"><br><br>
  <button type="submit">Enviar</button>
</form>
